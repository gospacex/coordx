# coordx consul 驱动示例配置
#
# 与 coordx/consul/docker-compose.yml 对齐：宿主 8500。
# consul api 的 Address 可直接写 host:port（不带 scheme 时默认 http）。
#
# 调用链：enable_trace 打开后注册/发现/租约操作会产 coord.* span；宿主装配
# otelx 后可在 Jaeger 看到，未装配时落在 noop provider 上，不影响功能。
coordx:
  standalone:
    - driver: consul
      name: default
      addr: "127.0.0.1:8500"
      enable_trace: true
