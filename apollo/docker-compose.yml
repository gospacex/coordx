# coordx/apollo（Apollo + 依赖 MySQL） - 独立开发环境
# 用法：scripts/start.sh / scripts/verify.sh / scripts/stop.sh
# 服务定义与 coordx/docker-compose.yml 中对应段一致，只改了容器名与网络名前缀，
# 避免与根 compose（一次起全套）重名冲突。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # Apollo QuickStart 自带 ConfigDB/PortalDB，必须先有 MySQL
  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:8.4
    cpus: "0.5"
    container_name: hubx-coordx-mysql
    ports:
      - "3306:3306"
    command:
      - --sql-mode=ONLY_FULL_GROUP_BY,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging

  apollo:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nobodyiam/apollo-quick-start:2.4.0
    cpus: "0.5"
    container_name: hubx-coordx-apollo
    ports:
      - "${HOST_PORT:-8070}:8070"
      - "8085:8080"
    environment:
      APOLLO_CONFIG_DB_URL: jdbc:mysql://mysql:3306/ApolloConfigDB?characterEncoding=utf8&serverTimezone=Asia/Shanghai
      APOLLO_CONFIG_DB_USERNAME: root
      APOLLO_CONFIG_DB_PASSWORD: rootpass
      APOLLO_PORTAL_DB_URL: jdbc:mysql://mysql:3306/ApolloPortalDB?characterEncoding=utf8&serverTimezone=Asia/Shanghai
      APOLLO_PORTAL_DB_USERNAME: root
      APOLLO_PORTAL_DB_PASSWORD: rootpass
      JAVA_OPTS: "-Xms256m -Xmx512m -Dspring.jpa.hibernate.ddl-auto=update -Dspring.sql.init.mode=always"
    command: sh -c "sed -i 's/max_counter=24/max_counter=60/' /apollo-quick-start/demo.sh && /apollo-quick-start/demo.sh start"
    depends_on:
      mysql:
        condition: service_healthy
    # 根 compose 里 apollo 没有 healthcheck，start.sh 无法等待就绪，故此处补一个
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging

networks:
  default:
    name: hubx-coordx-apollo-net
    driver: bridge
